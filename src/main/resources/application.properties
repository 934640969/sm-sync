# 数据同步定时任务Cron表达式
cron=0 0/2 * * * ?
# 最大错误重试次数
errorCount=3
# 睡眠时间(毫秒)
sleepTime=1000
# 日志清理定时任务Cron表达式
logBakcron=0 0 2 1 1/3 ?
# 日志保留月数
logRetentionMonths=3
# 日志分批删除每批数量
logBatchDeleteSize=1000
# 使用2个线程的线程池，避免任务相互阻塞
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=scheduled-task-